appId: com.allsearch.local
productName: AllSearch
directories:
  output: release/desktop
files:
  - dist/desktop/main.cjs
extraResources:
  - from: dist/desktop/serverRunner.cjs
    to: serverRunner.cjs
  # electron-builder unconditionally strips a `node_modules` dir that sits directly at the root of
  # a copy's `from` path (app-builder-lib's filter.js: `if (relative === "node_modules") return
  # false`), no matter what `files`/`filter` patterns say. `from: dist/desktop/standalone` would put
  # node_modules exactly at that root, so it copies from one level up and filters down to
  # `standalone/**/*` — node_modules then lands as `standalone/node_modules`, which the hardcoded
  # check doesn't match. Without this, `require('next')` fails and the server never starts.
  - from: dist/desktop
    to: .
    filter:
      - 'standalone/**/*'
  - from: dist/desktop/drizzle
    to: drizzle
asar: true
publish: null
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
